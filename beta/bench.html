<!doctype html><meta charset="utf-8"><title>ClipKaro bench</title>
<body style="font:14px monospace;background:#111;color:#eee;padding:16px">
<input type="file" id="f" accept="video/*"> <button id="go">Run</button><pre id="log"></pre>
<script type="module">
import { Input, Output, Conversion, ALL_FORMATS, BlobSource, BufferTarget, Mp4OutputFormat, VideoSampleSink, QUALITY_HIGH, QUALITY_MEDIUM } from 'https://cdn.jsdelivr.net/npm/mediabunny@1.60.0/+esm';
const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
const T = 30;
async function conv(file, video, label) {
  const input = new Input({ source: new BlobSource(file), formats: ALL_FORMATS });
  const output = new Output({ format: new Mp4OutputFormat({ fastStart: 'in-memory' }), target: new BufferTarget() });
  const c = await Conversion.init({ input, output, trim: { start: 10, end: 10 + T }, video, audio: { codec: 'aac', quality: QUALITY_HIGH } });
  const t0 = performance.now(); let frames = 0;
  await c.execute();
  const s = (performance.now() - t0) / 1000;
  log(`${label}: ${s.toFixed(2)}s  → ${(T / s).toFixed(1)}x realtime, ${(output.target.buffer.byteLength / 1e6).toFixed(1)} MB`);
}
function proc(W, H, mode) {
  const cv = new OffscreenCanvas(W, H), ctx = cv.getContext('2d', { alpha: false });
  const bg = new OffscreenCanvas(27, 48), bx = bg.getContext('2d');
  return (sample) => {
    const vw = sample.displayWidth, vh = sample.displayHeight;
    if (mode >= 1) { const kb = Math.max(27 / vw, 48 / vh); sample.draw(bx, (27 - vw * kb) / 2, (48 - vh * kb) / 2, vw * kb, vh * kb); ctx.drawImage(bg, 0, 0, W, H); }
    const k = Math.min(W / vw, H / vh); sample.draw(ctx, (W - vw * k) / 2, (H - vh * k) / 2, vw * k, vh * k);
    if (mode >= 2) { ctx.font = '900 92px Poppins, Arial'; ctx.lineWidth = 18; ctx.strokeStyle = '#000'; ctx.fillStyle = '#fff'; ctx.textAlign='center'; ctx.strokeText('HELLO THERE WORLD', W / 2, H * 0.72); ctx.fillText('HELLO THERE WORLD', W / 2, H * 0.72); }
    return cv;
  };
}
document.getElementById('go').onclick = async () => {
  const file = document.getElementById('f').files[0];
  const input = new Input({ source: new BlobSource(file), formats: ALL_FORMATS });
  const vt = await input.getPrimaryVideoTrack();
  log(`codec ${await vt.getCodec()} ${await vt.getDisplayWidth()}x${await vt.getDisplayHeight()}`);
  let t0 = performance.now(), n = 0;
  for await (const s of new VideoSampleSink(vt).samples(10, 10 + T)) { n++; s.close(); }
  log(`decode only: ${((performance.now() - t0) / 1000).toFixed(2)}s for ${n} frames → ${(T / ((performance.now() - t0) / 1000)).toFixed(1)}x`);
  const base = { codec: 'avc', frameRate: 30 };
  await conv(file, { ...base, width: 1080, height: 1920, fit: 'contain', quality: QUALITY_HIGH }, 'builtin resize 1080x1920 high');
  await conv(file, { ...base, width: 1080, height: 1920, fit: 'contain', quality: QUALITY_HIGH, hardwareAcceleration: 'prefer-hardware' }, 'builtin resize HW');
  await conv(file, { ...base, width: 720, height: 1280, fit: 'contain', quality: QUALITY_HIGH, hardwareAcceleration: 'prefer-hardware' }, 'builtin resize 720x1280 HW');
  await conv(file, { ...base, quality: QUALITY_HIGH, processedWidth: 1080, processedHeight: 1920, forceTranscode: true, process: proc(1080, 1920, 0) }, 'process plain 1080');
  await conv(file, { ...base, quality: QUALITY_HIGH, processedWidth: 1080, processedHeight: 1920, forceTranscode: true, process: proc(1080, 1920, 2), hardwareAcceleration: 'prefer-hardware' }, 'process blur+text 1080 HW');
  await conv(file, { ...base, quality: QUALITY_MEDIUM, processedWidth: 1080, processedHeight: 1920, forceTranscode: true, process: proc(1080, 1920, 2), hardwareAcceleration: 'prefer-hardware' }, 'process blur+text 1080 HW medium');
  await conv(file, { ...base, quality: QUALITY_HIGH, processedWidth: 720, processedHeight: 1280, forceTranscode: true, process: proc(720, 1280, 2), hardwareAcceleration: 'prefer-hardware' }, 'process blur+text 720 HW');
  log('done');
};
</script>
